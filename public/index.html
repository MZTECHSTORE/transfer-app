<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferência Visa → M-Pesa / eMola</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-4 text-center text-blue-600">Transferência Vendorapay</h1>

    <form id="transferForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Método de pagamento</label>
        <select id="paymentMethod" class="mt-1 w-full border rounded-md p-2">
          <option value="card">Visa / MasterCard</option>
          <option value="mpesa">M-Pesa</option>
          <option value="emola">eMola</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Telefone do destinatário</label>
        <input type="text" id="recipientPhone" class="mt-1 w-full border rounded-md p-2" placeholder="84xxxxxxx" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Valor (MT)</label>
        <input type="number" id="amount" class="mt-1 w-full border rounded-md p-2" placeholder="Ex: 500" required>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">Enviar</button>
      <div id="response" class="text-sm text-gray-700 mt-2"></div>
    </form>
  </div>

  <script>
    document.getElementById('transferForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        paymentMethod: document.getElementById('paymentMethod').value,
        recipientPhone: document.getElementById('recipientPhone').value,
        amount: document.getElementById('amount').value
      };

      const res = await fetch('/api/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      document.getElementById('response').innerText = JSON.stringify(json, null, 2);
    });
  </script>
</body>
</html>
